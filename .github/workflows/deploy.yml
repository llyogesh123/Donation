name: CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Ensure this matches your Node.js version

    - name: Install dependencies
      working-directory: client
      run: npm install

    - name: Run Tests
      working-directory: client
      run: npm test || echo "No tests found"  # Prevents breaking if no tests exist

    - name: Build Project
      working-directory: client
      run: npm run build
